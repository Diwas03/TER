name: TER price alert

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read the buy price without sending WhatsApp or changing state
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ter-price-monitor
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TER_RUNTIME_DIR: .runtime
      TER_URL: ${{ vars.TER_URL || 'https://ter.bt/portal/dashboard/trade/buy' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TER_THRESHOLD: '126'
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
      TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
      MONITOR_API_TOKEN: ${{ secrets.MONITOR_API_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore alert suppression state only
        uses: actions/cache/restore@v4
        with:
          path: .runtime/state.json
          key: ter-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ter-state-v1-
      - name: Check TER buy price
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 monitor.py --once --dry-run
          else
            python3 monitor.py --once
          fi
      - name: Save alert suppression state only
        if: success() && env.DRY_RUN != 'true'
        uses: actions/cache/save@v4
        with:
          path: .runtime/state.json
          key: ter-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
